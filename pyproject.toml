[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claire-speech-engine"
version = "1.0.5"
description = "A production-grade, modular speech engine framework."
readme = "README.md"
license = {text = "MIT"}
authors = [
    { name = "CSE Team" }
]
keywords = ["speech", "synthesis", "tts", "text-to-speech"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.10",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

requires-python = ">=3.10,<3.13"
dependencies = [
    "espeakng-loader",
    "phonemizer",
    "huggingface_hub",
    "numpy",
    "onnxruntime",
    "sounddevice",
    "soundfile",
    "pyyaml",
    "rich",
    "loguru",
]

[project.urls]
Homepage = "https://github.com/Yukariii04/Claire-Speech-Engine"
Repository = "https://github.com/Yukariii04/Claire-Speech-Engine"
Changelog = "https://github.com/Yukariii04/Claire-Speech-Engine/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-benchmark",
    "pre-commit",
    "build",
]

[project.scripts]
cse = "cse.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cse = [
    "_scaffold/*.py",
    "_scaffold/*.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v"
